<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Tarayici cubugunun rengi de temayi takip ediyor; tek bir deger kalsaydi
      koyu temada ekranin tepesinde acik bir serit dururdu.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF4F2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1114" />
    <title>EvenUp</title>

    <!--
      TEMA PARLAMASINI ONLEYEN SCRIPT (2.6)
      -------------------------------------
      React mount olana kadar `<html>` uzerinde `dark` sinifi olmaz; koyu tema
      secmis bir kullanici sayfa her yenilendiginde bir kare **beyaz** ekran
      gorur. Bu script ilk boyamadan once calisip sinifi kendisi koyuyor.

      `defer`/`module` DEGIL, bilerek senkron: modul script'leri ertelenir ve
      ertelenmis bir script parlamayi onleyemez.

      Anahtar `web/src/lib/theme.ts` icindeki `THEME_STORAGE_KEY` ile ayni olmak
      zorunda; burasi bir modul olmadigi icin import edemiyor. try/catch var
      cunku localStorage bazi gizlilik ayarlarinda erisim hatasi firlatir —
      o durumda tema calismasin, ama uygulama da acilmadan olmesin.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('evenup.theme');
          var isDark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);

          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          /* tema uygulanamadi; varsayilan acik tema ile devam */
        }
      })();
    </script>

    <!--
      Fraunces (display) yalnizca h1/h2 ve marka logosunda; Inter body metninde.
      `preconnect` iki host icin de gerekli: fonts.googleapis.com stil dosyasini,
      fonts.gstatic.com font dosyalarini sunuyor.
      `display=swap`: font inerken metin gorunmez kalmasin (FOIT yerine FOUT).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
